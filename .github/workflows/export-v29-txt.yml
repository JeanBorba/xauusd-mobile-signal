name: Export V29 App TXT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v29-txt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create TXT copy
        run: |
          set -euo pipefail
          cp App.js XAUUSD-Mobile-Signal-V29-App.txt
          cmp -s App.js XAUUSD-Mobile-Signal-V29-App.txt
          echo "TXT byte-for-byte copy OK"
      - name: Upload TXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Signal-V29-App
          path: XAUUSD-Mobile-Signal-V29-App.txt
          if-no-files-found: error
          retention-days: 30
