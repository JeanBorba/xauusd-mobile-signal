name: Publish XAUUSD Mobile Signal V27

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble App.js
        shell: bash
        run: |
          set -euo pipefail
          cat v27/part0.txt v27/part1.txt v27/part2.txt v27/part3.txt v27/part4.txt > App.js
          test -s App.js

      - name: Validate JavaScript/JSX
        run: |
          node -e "const fs=require('fs'); const cp=require('child_process'); cp.execFileSync('npx',['--yes','@babel/parser','--help'],{stdio:'ignore'});"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @babel/parser >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs');
          const parser=require('@babel/parser');
          const code=fs.readFileSync('App.js','utf8');
          parser.parse(code,{sourceType:'module',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
          console.log('V27 JSX/JavaScript syntax: OK');
          NODE

      - name: Remove assembly parts
        run: rm -rf v27

      - name: Commit final App.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.js package.json package-lock.json
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish XAUUSD Mobile Signal V27 OTC online and automatic sessions'
            git push
          fi
