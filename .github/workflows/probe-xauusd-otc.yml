name: Probe XAUUSD OTC Feed

on:
  push:
    branches: [server-v1]
    paths:
      - '.github/workflows/probe-xauusd-otc.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Planalto Quotex XAUUSD OTC live endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo '--- HTTPS live endpoint ---'
          curl -L --fail --silent --show-error --max-time 20 \
            'https://alltradingapi.com/live/qx_live.ts?asset=XAUUSD_otc' | tee /tmp/xau-live.txt
          echo
          echo '--- Validate numeric quote appears ---'
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('/tmp/xau-live.txt').read_text(errors='replace')
          nums=[float(x) for x in re.findall(r'(?<![\w.])(\d{4}(?:\.\d+)?)(?![\w.])', s)]
          gold=[x for x in nums if 2500 < x < 7000]
          print('candidate_quotes=', gold[:20])
          if not gold:
              raise SystemExit('No plausible XAUUSD OTC quote found')
          PY
          echo '--- Checker sample ---'
          curl -L --silent --show-error --max-time 20 \
            'https://alltradingapi.com/checker/otc_checker.ts?pair=XAUUSD_otc&start_time=00:00&end_time=23:59&day=0' \
            | head -c 8000 || true
          echo
