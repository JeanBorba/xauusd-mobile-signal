name: Probe XAUUSD OTC Feed

on:
  push:
    branches: [server-v1]
    paths:
      - '.github/workflows/probe-xauusd-otc.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public XAUUSD OTC endpoints
        shell: bash
        run: |
          set -u
          urls=(
            'http://alltradingapi.com/live/qx_live.ts?asset=XAUUSD_otc'
            'https://alltradingapi.com/live/qx_live.ts?asset=XAUUSD_otc'
            'http://alltradingapi.com/live/qx_live.ts?asset=xauusd_otc'
            'https://alltradingapi.com/live/qx_live.ts?asset=xauusd_otc'
            'https://alltradingapi.com/live/qx_live.js?asset=XAUUSD_otc'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L --silent --show-error --max-time 20 \
              -A 'Mozilla/5.0 XAUUSD-Mobile-Signal/2.1' \
              -w '\nHTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' "$u" | head -c 12000 || true
            echo
          done
          echo '===== checker ====='
          curl -L --silent --show-error --max-time 20 \
            -A 'Mozilla/5.0 XAUUSD-Mobile-Signal/2.1' \
            -w '\nHTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' \
            'http://alltradingapi.com/checker/otc_checker.ts?pair=XAUUSD_otc&start_time=00:00&end_time=23:59&day=0' \
            | head -c 12000 || true
          echo
