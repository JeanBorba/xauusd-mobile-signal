name: Finalize XAUUSD Mobile Signal V27
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('App.js')
          s=p.read_text(encoding='utf-8')

          sessions="""const SESSIONS = [
            { id: 'SYD', name: 'Sydney', openLocal: '19:00', closeLocal: '04:00' },
            { id: 'TKO', name: 'Tóquio', openLocal: '21:00', closeLocal: '06:00' },
            { id: 'LON', name: 'Londres', openLocal: '04:00', closeLocal: '12:00' },
            { id: 'NYC', name: 'N. York', openLocal: '09:00', closeLocal: '16:00' }
          ];"""
          s=re.sub(r"const SESSIONS = \[.*?\];",sessions,s,count=1,flags=re.S)

          market="""function brtParts(now) { return tzParts(now, BR_TZ); }
          function brtMinutes(now) { return brtParts(now).minutes; }
          function brtWeekday(now) { const p=brtParts(now); return {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday]; }
          function isStandardFxWeekend(now) { const d=brtWeekday(now),m=brtMinutes(now); return d===6 || (d===5 && m>=960) || (d===0 && m<1140); }
          function sessionActive(now,s) { const m=brtMinutes(now),[oh,om]=s.openLocal.split(':').map(Number),[ch,cm]=s.closeLocal.split(':').map(Number),a=oh*60+om,b=ch*60+cm; return a>b ? (m>=a || m<b) : (m>=a && m<b); }
          function sessionDisplayTimes(now,s) { return {openLocal:s.openLocal,closeLocal:s.closeLocal,openUtc:'',closeUtc:'',offset:'BRT'}; }
          function activeSessions(now) { return isStandardFxWeekend(now)?[]:SESSIONS.filter(s=>sessionActive(now,s)).map(s=>s.name); }
          function sessionState(now,s,connectionStatus,otcAvailable=false) { if(isStandardFxWeekend(now)) return otcAvailable?'OTC ONLINE':'OTC SEM FEED'; if(!sessionActive(now,s)) return 'FECHADA'; return connectionStatus==='ONLINE'?'ONLINE':'SEM FEED'; }
          """
          s=re.sub(r"function isStandardFxWeekend\(now\)\{.*?function sessionState\(now, session, connectionStatus, otcAvailable=false\) \{.*?\}\s*",market,s,count=1,flags=re.S)

          addtick="""const addTick = useCallback((p, ts, b, a, marketSource='OFFICIAL') => {
            if (!finite(p) || !finite(ts)) return;
            const otc=marketSource==='OTC';
            if (otc !== isStandardFxWeekend(new Date(ts))) return;
            setCandles(prev=>{
              let next=prev.filter(c=>c.closed!==false);
              if(!otc) { next=next.filter(c=>c.marketSource!=='OTC'); currentRef.current=null; }
              const bucket=Math.floor(ts/CANDLE_MS)*CANDLE_MS;
              const cur=currentRef.current && currentRef.current.marketSource===marketSource ? currentRef.current:null;
              if(cur && cur.t!==bucket){ next=mergeCandles(next,{...cur,closed:true,marketSource}); currentRef.current=null; }
              let c=currentRef.current;
              if(!c || c.marketSource!==marketSource) c={t:bucket,o:p,h:p,l:p,c:p,volume:1,delta:0,closed:false,marketSource};
              else { const dir=p>c.c?1:p<c.c?-1:0; c={...c,c:p,h:Math.max(c.h,p),l:Math.min(c.l,p),volume:(c.volume||0)+1,delta:(c.delta||0)+dir}; }
              currentRef.current=c; currentSourceRef.current=marketSource;
              const out=[...next,c].sort((x,y)=>x.t-y.t).slice(-MAX_CANDLES); persist(out); return out;
            });
            setPrice(p); if(finite(b))setBid(b); if(finite(a))setAsk(a); setTickTime(new Date(ts).toLocaleTimeString('pt-BR'));
          }, [persist]);
          """
          s=re.sub(r"const addTick = useCallback\(.*?\n\s*const connect = useCallback",addtick+"\n  const connect = useCallback",s,count=1,flags=re.S)

          otc="""useEffect(() => {
            let alive=true;
            const load=async()=>{
              if(!isStandardFxWeekend(new Date())) { if(alive)setWeekendOtc(null); return; }
              const q=await fetchWeekendOtcGold();
              if(alive){ setWeekendOtc(q); if(q && q.ageSec<=90) addTick(q.value,q.asOf,null,null,'OTC'); }
            };
            load(); const id=setInterval(load,30000);
            return()=>{alive=false;clearInterval(id);};
          }, [addTick]);
          const otcLive=!!weekendOtc && finite(weekendOtc.value) && weekendOtc.ageSec<=90;
          useEffect(()=>{
            if(isStandardFxWeekend(now)) return;
            setCandles(prev=>{ const clean=prev.filter(c=>c.marketSource!=='OTC'); if(clean.length!==prev.length){currentRef.current=null;currentSourceRef.current='OFFICIAL';persist(clean);return clean;} return prev; });
          },[now.getTime(),persist]);
          """
          if 'const otcLive=' not in s:
            s=s.replace('  const updateDxy = useCallback',otc+'\n  const updateDxy = useCallback',1)

          s=re.sub(r"const signal = useMemo\(.*?\n\s*const updateDxy = useCallback", """const signal = useMemo(() => {
            if(isStandardFxWeekend(now) && !otcLive) return {side:'N',text:'OTC SEM FEED',score:0,checks:[],buyConfirmations:0,sellConfirmations:0,confirmations:0,available:0};
            return buildSignal({price:priceNow,ema,rsi,adx,fvg,structure,pressure,dxy,vwap,sessions});
          },[priceNow,ema,rsi,adx,fvg,structure,pressure,dxy,vwap,sessions,otcLive,now.getTime()]);

  const updateDxy = useCallback""",s,count=1,flags=re.S)

          # Ensure candles retain their origin when normalized.
          s=s.replace("closed: c?.closed !== false }", "marketSource: c?.marketSource || c?.source || 'OFFICIAL', closed: c?.closed !== false }")
          s=s.replace("return { t: Math.floor(t / CANDLE_MS) * CANDLE_MS, o, h, l, c: close,", "return { t: Math.floor(t / CANDLE_MS) * CANDLE_MS, o, h, l, c: close,")
          p.write_text(s,encoding='utf-8')
          print('patched',len(s),'bytes')
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @babel/parser >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs'),parser=require('@babel/parser');
          parser.parse(fs.readFileSync('App.js','utf8'),{sourceType:'module',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
          console.log('V27 syntax OK');
          NODE
      - name: Cleanup temporary assembly files
        run: rm -rf v27 .github/workflows/publish-v27.yml
      - name: Commit final app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize V27 OTC online and BRT session automation'
          git push
