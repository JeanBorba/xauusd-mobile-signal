name: Publish XAUUSD Mobile Signal V29

on:
  push:
    branches: [main]
    paths:
      - 'v29/**'
      - '.github/workflows/publish-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact V29 App.js
        run: |
          set -euo pipefail
          cat v29/part0.txt v29/part1.txt v29/part2.txt v29/part3.txt v29/part4.txt v29/part5.txt > App.js
          test -s App.js
          grep -q 'XAUUSD MOBILE SIGNAL — V29' App.js
          grep -q "Sydney', openLocal: '19:00'" App.js
          grep -q "Tóquio', openLocal: '21:00'" App.js
          grep -q "Londres', openLocal: '04:00'" App.js
          grep -q "N. York', openLocal: '09:00'" App.js
          grep -q "SPOT_FALLBACK" App.js
          grep -q "XAUUSD OTC · ONLINE · ALIMENTA O MOTOR" App.js

      - name: Validate JSX and JavaScript
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @babel/parser >/dev/null 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          const code = fs.readFileSync('App.js','utf8');
          parser.parse(code, {
            sourceType: 'module',
            plugins: ['jsx','optionalChaining','nullishCoalescingOperator']
          });
          console.log('V29 JSX/JavaScript: OK');
          NODE

      - name: Publish App.js and mobile/App.js
        run: |
          set -euo pipefail
          mkdir -p mobile
          cp App.js mobile/App.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.js mobile/App.js
          if git diff --cached --quiet; then
            echo 'V29 already published.'
          else
            git commit -m 'Publish V29 automatic OTC and free XAUUSD fallback'
            git push
          fi
