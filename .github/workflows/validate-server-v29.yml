name: Validate XAUUSD Server V30 Doto

on:
  push:
    branches: [server-v1]
    paths:
      - 'server/server.js'
      - '.github/workflows/validate-server-v29.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate V30 server rules
        shell: bash
        run: |
          set -euo pipefail
          node --check server/server.js
          grep -q "day === 5 && minutes >= 16 \* 60" server/server.js
          grep -q "day === 0 && minutes < 19 \* 60" server/server.js
          grep -q "app.post('/ingest/doto/ticks'" server/server.js
          grep -q "app.post('/ingest/doto/history'" server/server.js
          grep -q 'doto-xauusd-otc' server/server.js
          grep -q 'DOTO XAUUSD_OTC M5 · REAL' server/server.js
          grep -q 'waiting-doto-xauusd-otc' server/server.js
          echo 'Server V30 static validation: OK'

      - name: Verify Render V30 and protected ingestion
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base='https://xauusd-mobile-signal.onrender.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            let last=null;
            for(let i=1;i<=24;i++){
              try{
                const r=await fetch(base+'/health?v30='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
                const j=await r.json(); last=j;
                const hasDoto=Object.prototype.hasOwnProperty.call(j,'doto');
                const noProxy=j.marketMode!=='OTC'||!String(j.primary||'').toLowerCase().includes('kraken');
                if(j.ok===true&&hasDoto&&noProxy){
                  const unauthorized=await fetch(base+'/ingest/doto/ticks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:'XAUUSD_OTC',ticks:[]})});
                  if(unauthorized.status!==401) throw new Error('Doto ingest protection expected 401, got '+unauthorized.status);
                  console.log('Render V30 Doto OK:',JSON.stringify({marketMode:j.marketMode,primary:j.primary,lastPrice:j.lastPrice,history:j.history,doto:j.doto,sessions:j.sessions}));
                  return;
                }
                console.log('Waiting V30',i,JSON.stringify({marketMode:j?.marketMode,primary:j?.primary,hasDoto}));
              }catch(e){console.log('Waiting V30',i,e.message)}
              await sleep(15000);
            }
            throw new Error('Render V30 validation failed: '+JSON.stringify(last));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
