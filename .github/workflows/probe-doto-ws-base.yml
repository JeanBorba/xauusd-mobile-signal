name: Probe Doto WS Base

on:
  push:
    branches: [server-v1]
    paths:
      - '.github/workflows/probe-doto-ws-base.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve websocket base from public Doto bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error --max-time 30 'https://client.doto.com/assets/server-tWFzCgKR.js' -o /tmp/server.js
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/server.js').read_text(errors='replace')
          for needle in ['https://api.doto.com/api','https://api.doto-1a.com/api','getHeaderString','/v2.0/ws']:
              print('\n===== NEEDLE',needle,'=====')
              pos=0
              hits=0
              while True:
                  i=s.find(needle,pos)
                  if i<0 or hits>=12: break
                  print(s[max(0,i-1200):min(len(s),i+1800)])
                  print('\n---')
                  pos=i+1; hits+=1
          print('\n===== EXPORT TAIL =====')
          print(s[-18000:])
          PY
