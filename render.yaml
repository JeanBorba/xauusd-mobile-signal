services:
  - type: web
    name: xauusd-mobile-signal
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MARKET_SYMBOL
        value: XAU/USD
      - key: HISTORY_SIZE
        value: "200"
      - key: HISTORY_REFRESH_MS
        value: "60000"
