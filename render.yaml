services:
  - type: web
    name: xauusd-mobile-signal
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BROKERET_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: HISTORY_SIZE
        value: "500"
